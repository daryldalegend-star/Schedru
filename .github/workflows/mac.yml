name: Mac

# Runs the tests on a real Mac. Nothing here can be exercised on the Linux
# machine the app is developed on, which is how a broken launcher once
# shipped untested.

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Machine
        run: |
          sw_vers
          uname -m
          python --version

      - name: Install
        run: python -m pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Platform probe
        run: python tools/mac_probe.py
        env:
          PROBE_OUT: probe-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out-py${{ matrix.python }}
          path: probe-out
          if-no-files-found: ignore
