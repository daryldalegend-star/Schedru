name: Real API check

# Reads three sample screenshots with the real Claude API and prints what it
# found and what it cost (a few cents in total). Never runs on its own: press
# "Run workflow" on the Actions tab. Needs a repository secret called
# ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    name: Read the samples with Claude
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Is there a key?
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No key yet::Nothing was sent to Claude. Add a repository secret named ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions > New repository secret), then run this workflow again."
          fi

      - name: Read the sample screenshots
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/real_api_check.py
