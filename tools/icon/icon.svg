<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Schedru's icon: a tear-off calendar page that is also a viewfinder.
       Drawn on Apple's icon grid: an 824px rounded square centred in 1024. -->
  <defs>
    <clipPath id="page"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8573f"/>
      <stop offset="1" stop-color="#c93a26"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a352e"/>
      <stop offset="0.5" stop-color="#1d1b18"/>
      <stop offset="1" stop-color="#11100e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a1608" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5a1408" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#page)">
    <rect x="100" y="100" width="824" height="268" fill="url(#band)"/>
    <rect x="100" y="368" width="824" height="10" fill="#7d1f12" opacity="0.18"/>
    <rect x="100" y="100" width="824" height="6" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- binder rings -->
  <g filter="url(#soft)">
    <rect x="322" y="150" width="68" height="176" rx="34" fill="url(#ring)"/>
    <rect x="634" y="150" width="68" height="176" rx="34" fill="url(#ring)"/>
  </g>
  <rect x="338" y="166" width="12" height="86" rx="6" fill="#ffffff" opacity="0.22"/>
  <rect x="650" y="166" width="12" height="86" rx="6" fill="#ffffff" opacity="0.22"/>

  <!-- viewfinder -->
  <g fill="none" stroke="#1d1b18" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 566v-80h92"/>
    <path d="M694 566v-80h-92"/>
    <path d="M330 716v80h92"/>
    <path d="M694 716v80h-92"/>
  </g>
  <circle cx="512" cy="641" r="58" fill="#d5402b"/>
  <circle cx="494" cy="623" r="16" fill="#ffffff" opacity="0.28"/>

  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="185.5" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
